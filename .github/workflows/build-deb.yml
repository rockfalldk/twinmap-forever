# Builds the Linux .deb on demand and leaves it as an artifact of the run, to download from the
# Actions tab (artifacts live 90 days). The release workflow (release.yml) attaches the .deb to
# tagged releases the same way.
name: Build deb

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deb:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
        with:
          ref: vibe/linux-deb-de1e66
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: Build the .deb
        run: |
          npx electron-vite build
          npx electron-builder --linux deb --publish never -c.extraMetadata.version=0.15.0
      - uses: actions/upload-artifact@v4
        with:
          name: twinmap-deb
          path: app/dist/*.deb
          retention-days: 90
